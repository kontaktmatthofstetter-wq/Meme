name: Max-Bot auf Cloudflare veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d9b0874b578293d2b5633bc961f1d08a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Speicher suchen oder anlegen und Bot hochladen
        working-directory: cloud
        run: |
          npm i -g wrangler@4 >/dev/null 2>&1
          rm -rf public && mkdir -p public/icons && cp ../*.html ../manifest-ki.json public/ && cp ../icons/*.png public/icons/ && ls public
          findkv() { wrangler kv namespace list 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const n=JSON.parse(s).find(x=>x.title==='maxbot-state');console.log(n?n.id:'')}catch(e){console.log('')}})"; }
          ID=$(findkv)
          if [ -z "$ID" ]; then wrangler kv namespace create maxbot-state; ID=$(findkv); fi
          echo "Speicher: $ID"; test -n "$ID"
          sed -i "s/^id = .*/id = \"$ID\"/" wrangler.toml
          wrangler deploy 2>&1 | tee deploy.log
          grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 > url.txt
          test -s url.txt
      - name: Adresse für die Seite speichern
        run: |
          echo "{\"url\":\"$(cat cloud/url.txt)\"}" > cloud-url.json; cat cloud-url.json
          git config user.name "maxbot-deploy"; git config user.email "actions@github.com"
          git add cloud-url.json
          git diff --cached --quiet || (git commit -m "Cloud-Adresse des Max-Bots" && git push)
